<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Iniciar sesión — Hotel El Rincón del Carmen" />
  <title>Iniciar Sesión | Hotel El Rincón del Carmen</title>

  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  <link rel="stylesheet" href="styles/auth.css" />
  <link rel="stylesheet" href="styles/components/navbar.css" />
</head>
<body class="page-wrapper">

  <navbar-component></navbar-component>

  <main class="auth">
    <div class="auth__container">

      <!-- Header -->
      <div class="auth__header">
        <span class="auth__eyebrow">Bienvenido de nuevo</span>
        <h1 class="auth__title">Iniciar <em>Sesión</em></h1>
        <p class="auth__subtitle">
          Accede a tu cuenta para gestionar tus reservas
        </p>
      </div>

      <form class="auth__form" id="loginForm" novalidate>

        <div class="auth__form-group form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="auth__form-group form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="auth__form-footer">
          <button type="submit" class="btn btn--primary btn--full btn--lg">
            Iniciar Sesión
          </button>

          <p class="auth__footer-text">
            ¿No tienes cuenta?
            <a href="registro.html">Regístrate aquí</a>
          </p>

          <p class="auth__footer-text">
            <a href="index.html">← Volver al inicio</a>
          </p>
        </div>

      </form>

    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="database/mockData.js"></script>
  <script src="js/services/localStorage.service.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script src="js/utils/validaciones.js"></script>
  <script src="js/utils/alertas.js"></script>
  <script src="js/utils/formatearPrecio.js"></script>
  <script src="js/utils/fechas.js"></script>
  <script src="js/components/navbar/navbar.js"></script>
  <script src="js/pages/loginPage.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
