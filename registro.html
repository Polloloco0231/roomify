<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Registro de usuario — Hotel El Rincón del Carmen" />
  <title>Crear Cuenta | Hotel El Rincón del Carmen</title>

  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  <link rel="stylesheet" href="styles/auth.css" />
  <link rel="stylesheet" href="styles/components/navbar.css" />

  <link rel="stylesheet" href="js/components/carrusel/carrusel.css" />
  <link rel="stylesheet" href="js/components/footer/footer.css">
  <link rel="stylesheet" href="js/components/navbar/navbar.css">
  <link rel="stylesheet" href="js/components/modal/modal.css">
  <link rel="stylesheet" href="js/components/room-card/room-card.css">
  <link rel="stylesheet" href="js/components/reserva-form/reserva-form.css">
</head>
<body class="page-wrapper">


  <main class="auth">
    <div class="auth__container" style="max-width: 600px;">

      <!-- Header -->
      <div class="auth__header">
        <span class="auth__eyebrow">Hotel El Rincón del Carmen</span>
        <h1 class="auth__title">Crear <em>Cuenta</em></h1>
        <p class="auth__subtitle">
          Regístrate para poder hacer y gestionar tus reservas
        </p>
      </div>

      <form class="auth__form" id="registroForm" novalidate>

        <div class="auth__form-group form-group">
          <label class="form-label" for="identificacion">Número de Identificación</label>
          <input
            type="text"
            id="identificacion"
            name="identificacion"
            class="form-input"
            placeholder="Cédula o pasaporte"
            autocomplete="off"
            required
          />
        </div>

        <div class="auth__form-group form-group">
          <label class="form-label" for="nombre">Nombre Completo</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            class="form-input"
            placeholder="Nombre y apellidos"
            autocomplete="name"
            required
          />
        </div>

        <div class="auth__form-group form-group">
          <label class="form-label" for="nacionalidad">Nacionalidad</label>
          <input
            type="text"
            id="nacionalidad"
            name="nacionalidad"
            class="form-input"
            placeholder="Ej: Colombiana"
            autocomplete="off"
            required
          />
        </div>

        <div class="auth__form-group form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="auth__form-group form-group">
          <label class="form-label" for="telefono">Teléfono</label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            class="form-input"
            placeholder="Ej: 3001234567"
            autocomplete="tel"
            required
          />
        </div>

        <div class="auth__form-group form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="auth__form-group form-group">
          <label class="form-label" for="confirmarPassword">Confirmar Contraseña</label>
          <input
            type="password"
            id="confirmarPassword"
            name="confirmarPassword"
            class="form-input"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="auth__form-footer">
          <button type="submit" class="btn btn--primary btn--full btn--lg">
            Crear Cuenta
          </button>

          <p class="auth__footer-text">
            ¿Ya tienes cuenta?
            <a href="login.html">Inicia sesión aquí</a>
          </p>

          <p class="auth__footer-text">
            <a href="index.html">← Volver al inicio</a>
          </p>
        </div>

      </form>

    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="database/mockData.js"></script>
  <script src="js/services/localStorage.service.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script src="js/utils/validaciones.js"></script>
  <script src="js/utils/alertas.js"></script>
  <script src="js/utils/formatearPrecio.js"></script>
  <script src="js/utils/fechas.js"></script>
  <script src="js/components/navbar/navbar.js"></script>
  <script src="js/pages/registroPage.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
